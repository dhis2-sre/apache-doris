name: Build and publish

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Rebuilt nightly so a published tag keeps picking up fixes to the Doris image it derives from,
  # rather than freezing at whenever someone last touched this repository.
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show what will be built
        run: yq '.' versions.yaml

      # A pull request builds every image but publishes none, so a change to the Dockerfile or to
      # the driver checksum fails here rather than after it has been merged.
      - name: Build
        if: github.event_name == 'pull_request'
        run: make build-all

      - name: Log into registry
        if: github.event_name != 'pull_request'
        run: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish
        if: github.event_name != 'pull_request'
        run: make all
